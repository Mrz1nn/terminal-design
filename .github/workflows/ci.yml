# Actions used: actions/checkout (MIT), actions/setup-node (MIT). Both maintained by GitHub.
name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest = Apple Silicon (arm64), macos-15-intel = Intel (x64)
        os: [windows-latest, ubuntu-latest, macos-latest, macos-15-intel]
        node: ['18', '20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run lint
      - run: npm test
      - name: CLI smoke test
        run: |
          node bin/td.js version
          node bin/td.js theme list --no-color
          node bin/td.js doctor --json
        env:
          TD_DATA_HOME: ${{ runner.temp }}/td-data
          TD_CONFIG_HOME: ${{ runner.temp }}/td-config
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude

      # Real install on macOS/Linux into a throwaway HOME: installer, PATH block, shim,
      # Claude Code integration, status line through the shim, uninstall.
      - name: Install smoke test (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME" && touch "$HOME/.zshrc"
          unset TD_DATA_HOME TD_CONFIG_HOME
          export CLAUDE_CONFIG_DIR="$HOME/.claude"
          sh scripts/install.sh --claude-code
          grep -q "terminal-design" "$HOME/.zshrc"
          TD="$HOME/.local/share/terminal-design/bin/td"
          "$TD" version
          "$TD" doctor --no-color || true
          CMD=$(node -e "console.log(require(process.env.CLAUDE_CONFIG_DIR + '/settings.json').statusLine.command)")
          echo "status line command: $CMD"
          OUT=$(env -i HOME="$HOME" PATH=/usr/bin:/bin sh -c "$CMD" < tests/fixtures/statusline-sample.json)
          echo "$OUT"
          echo "$OUT" | grep -q "Opus 5.5"
          # /tema and /td are installed with the status line
          test -f "$CLAUDE_CONFIG_DIR/commands/tema.md"
          test -f "$CLAUDE_CONFIG_DIR/commands/td.md"
          if [ "$RUNNER_OS" = "macOS" ]; then
            # iTerm2 colors through the Dynamic Profile (iTerm2 itself is simulated by its prefs file)
            mkdir -p "$HOME/Library/Preferences" && touch "$HOME/Library/Preferences/com.googlecode.iterm2.plist"
            "$TD" theme set nord --terminal --quiet-preview --no-color
            P="$HOME/Library/Application Support/iTerm2/DynamicProfiles/terminal-design.json"
            node -e "const p=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).Profiles[0]; if(p.Name!=='Terminal-Design'||!p['Ansi 15 Color']) process.exit(1)" "$P"
            "$TD" theme terminal off --no-color
            test ! -f "$P"
          fi
          "$TD" uninstall --yes
          test ! -f "$CLAUDE_CONFIG_DIR/commands/tema.md"
          ! grep -q "terminal-design" "$HOME/.zshrc"

      # One-line installer (get.sh / get.ps1) against a release zip built from this commit.
      - name: One-line install (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pack-release.js --out="$RUNNER_TEMP/dist"
          export HOME="$RUNNER_TEMP/home2"
          mkdir -p "$HOME" && touch "$HOME/.zshrc"
          unset TD_DATA_HOME TD_CONFIG_HOME
          export CLAUDE_CONFIG_DIR="$HOME/.claude"
          V=$(node -p "require('./package.json').version")
          TD_RELEASE_ZIP="$RUNNER_TEMP/dist/terminal-design-$V.zip" TD_RELEASE_SUMS="$RUNNER_TEMP/dist/SHA256SUMS.txt" sh scripts/get.sh
          "$HOME/.local/share/terminal-design/bin/td" version
          CMD=$(node -e "console.log(require(process.env.CLAUDE_CONFIG_DIR + '/settings.json').statusLine.command)")
          env -i HOME="$HOME" PATH=/usr/bin:/bin sh -c "$CMD" < tests/fixtures/statusline-sample.json | grep -q "Opus 5.5"

      - name: One-line install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/pack-release.js --out="$env:RUNNER_TEMP/dist"
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $env:TD_DATA_HOME = "$env:RUNNER_TEMP\td-get-data"
          $env:TD_CONFIG_HOME = "$env:RUNNER_TEMP\td-get-config"
          $env:CLAUDE_CONFIG_DIR = "$env:RUNNER_TEMP\td-get-claude"
          $env:TD_NO_PATH = '1'
          $env:TD_RELEASE_ZIP = "$env:RUNNER_TEMP\dist\terminal-design-$v.zip"
          $env:TD_RELEASE_SUMS = "$env:RUNNER_TEMP\dist\SHA256SUMS.txt"
          Get-Content scripts/get.ps1 -Raw | Invoke-Expression
          & "$env:TD_DATA_HOME\bin\td.cmd" version
          if ($LASTEXITCODE -ne 0) { throw 'td.cmd failed' }
